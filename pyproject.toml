[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "styxscan"
version = "0.1.0"
description = "Security Research Toolkit"
requires-python = ">=3.10"

dependencies = [
    "requests",
    "dnspython",
    "rich"
]

[project.scripts]
styxscan = "styxscan.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]


